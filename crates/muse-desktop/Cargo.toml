[package]
name = "muse-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
muse-core = { path = "../muse-core" }
muse-proxy = { path = "../muse-proxy" }
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
wry = { version = "=0.57.1", default-features = false, features = ["os-webview"] }
serde.workspace = true
serde_json.workspace = true
url.workspace = true
uuid.workspace = true
unicode-segmentation = "1.12"
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Time", "Win32_System_DataExchange", "Win32_System_Memory"] }
raw-window-handle = "0.6"
zeroize = "1.8"
base64 = "0.22"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
percent-encoding = "2"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "io-util"] }



