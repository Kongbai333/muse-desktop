[package]
name = "muse-proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
marmo-proto = "=0.0.4"
marmo-net = "=0.0.4"
ring = "=0.17.14"
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", features = ["sink"] }
serde.workspace = true
serde_json.workspace = true
zeroize = "1.9"
shadowsocks = { version = "=1.23.2", default-features = false, features = ["aead-cipher"] }
base64 = "0.22"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
httparse = "=1.10.1"
fast-socks5 = "=1.0.0"
percent-encoding = "2"
rustls-native-certs = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "=0.7.20", features = ["rt", "codec", "io"] }
url.workspace = true
uuid.workspace = true

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }

