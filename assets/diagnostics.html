<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PAGE_TITLE}} · Muse</title>
<style>
:root{color-scheme:light;--ink:#242832;--secondary:#747b88;--line:#e8eaee;--surface:#f6f7f9;--blue:#0071e3}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:13px/1.6 "Segoe UI Variable","Segoe UI","Microsoft YaHei UI",sans-serif}main{max-width:880px;min-height:100vh;display:flex;flex-direction:column;justify-content:center;margin:auto;padding:44px}header{display:flex;gap:14px;align-items:center;margin-bottom:22px}.mark{display:grid;place-items:center;width:43px;height:43px;border:1px solid var(--line);border-radius:11px;box-shadow:0 2px 5px #19253408;color:var(--blue);font-size:25px;font-weight:650}h1{font-size:27px;font-weight:650;line-height:1.3;letter-spacing:-.7px;margin:0}header p{font-size:11px;margin:4px 0 0;color:var(--secondary)}.rule{height:1px;background:var(--line);margin-bottom:24px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:26px}.section-label{font-size:11px;color:var(--secondary);font-weight:600;display:flex;justify-content:space-between;align-items:center;margin:0 0 11px}.section-label span{font-weight:400}.panel{border:1px solid var(--line);background:var(--surface);border-radius:10px;overflow:hidden}.row{display:flex;align-items:center;gap:12px;min-height:63px;padding:13px 15px;border-bottom:1px solid #ebedf1;text-decoration:none;color:var(--ink)}.row:last-child{border-bottom:0}.row:hover,a.tile:hover{background:#eef1f6}.icon{display:grid;place-items:center;flex-shrink:0;width:28px;height:28px;border:1px solid var(--line);border-radius:6px;background:#f1f3f6}.icon img{width:16px;height:16px;opacity:.65}.text{flex:1;min-width:0}.text strong{display:block;font-size:12px;font-weight:550}.text small{display:block;color:var(--secondary);font-size:10px;margin-top:2px}.arrow{width:13px;height:13px;opacity:.45}.tiles{display:flex;gap:10px;margin-bottom:13px}.tile{flex:1;display:flex;align-items:center;gap:11px;padding:15px 12px;min-height:64px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:12px;font-weight:550}.tile.primary{border-color:#8bc0f7;background:#f8fbff}.tile.primary .icon{background:var(--blue);border-color:var(--blue)}.tile.primary .icon img{filter:invert(1);opacity:1}input{display:block;width:100%;min-width:0;padding:8px 10px;font:12px "Segoe UI Variable","Segoe UI","Microsoft YaHei UI",sans-serif;border:1px solid #dde1e8;border-radius:6px;background:#fff;outline:none;color:var(--ink)}input:focus{border-color:#8abcf1;box-shadow:0 0 0 2px #0071e312}.input-row{padding:14px 15px}.input-row label{display:block;font-size:11px;color:var(--secondary);margin-bottom:9px}.note{padding:15px;color:var(--secondary);font-size:11px;line-height:1.8}.note strong{color:#515968;font-weight:550}footer{display:flex;gap:18px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);margin-top:24px;padding-top:17px;font-size:10px;color:var(--secondary)}kbd{background:#f3f4f7;border:1px solid #ebedf1;border-radius:3px;padding:2px 4px;font:9px "Segoe UI",sans-serif;margin-right:5px}.environment{margin-left:auto;font-size:10px;color:#929aa6}details{margin-top:22px;font-size:10px;color:#929aa6}summary{cursor:pointer}code{display:block;margin-top:8px;font:11px Consolas,monospace;color:#747b88;overflow-wrap:anywhere}#where{margin-left:6px}
@media(max-width:660px){main{padding:28px;justify-content:flex-start}.columns{grid-template-columns:1fr;gap:20px}.environment{margin-left:0}}
</style></head>
<body><main><header><div class="mark">M</div><div><h1>{{PAGE_TITLE}}</h1><p>检查浏览环境，继续当前工作。</p></div></header><div class="rule"></div>
<div class="columns"><section><div class="section-label">浏览与导航<span>本机验证</span></div><div class="panel">
<a class="row" href="/next"><span class="icon"><img src="/icons/arrow-right.svg" alt=""></span><span class="text"><strong>进入第二个页面</strong><small>使用外层的返回与前进，回到这里。</small></span><img class="arrow" src="/icons/chevron-right.svg" alt=""></a>
<a class="row" href="/popup" target="_blank"><span class="icon"><img src="/icons/external-link.svg" alt=""></span><span class="text"><strong>在新标签页中打开</strong><small>保留当前页面，共享同账号的登录环境。</small></span><img class="arrow" src="/icons/chevron-right.svg" alt=""></a>
<a class="row" href="/"><span class="icon"><img src="/icons/home.svg" alt=""></span><span class="text"><strong>返回诊断首页</strong><small>每次切换都有明确的返回路径。</small></span><img class="arrow" src="/icons/chevron-right.svg" alt=""></a>
</div></section>
<section><div class="section-label">输入与账号<span>独立浏览环境</span></div><div class="panel"><div class="input-row"><label for="typing">中文输入与焦点</label><input id="typing" aria-label="中文输入验证" placeholder="试着输入：你好，Muse"></div><div class="note" style="border-top:1px solid var(--line)"><strong>套餐进度与头像</strong><br>诊断页不提供真实额度。打开 Muse 后，账号卡片显示已用进度与账户头像。</div></div><div class="note" style="padding:12px 1px 0">切换到另一个账号，可检查登录环境是否独立；切回来后，页面和环境应保持。</div></section></div>
<footer><span><kbd>Alt ←</kbd>返回</span><span><kbd>Ctrl L</kbd>地址栏</span><span><kbd>Ctrl T</kbd>新建标签</span><span class="environment">数据仅保存在本机</span></footer><details><summary>浏览环境信息 <span id="where"></span></summary><code id="marker">正在读取…</code></details>
</main>
<script>
let marker=localStorage.getItem('muse-desktop-diagnostic-marker');
if(!marker){marker=Array.from(crypto.getRandomValues(new Uint8Array(16)),value=>value.toString(16).padStart(2,'0')).join('');localStorage.setItem('muse-desktop-diagnostic-marker',marker)}
document.getElementById('marker').textContent=marker;
document.getElementById('where').textContent=location.pathname;
function reportReady(){if(window.ipc&&document.readyState==='complete')window.ipc.postMessage(JSON.stringify({kind:'diagnostic',marker}));}
window.addEventListener('pageshow',reportReady);
</script></html>
