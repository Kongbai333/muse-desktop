name: Desktop Windows x64
run-name: ${{ github.workflow }} / ${{ inputs.build_request_id || github.ref_name }}

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_request_id:
        description: Optional build tracking identifier (display only)
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup show active-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-2022-rust-1.95.0-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: windows-2022-rust-1.95.0-
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Browser adapter contracts
        run: |
          node --test scripts/check-observer.cjs tests/diagnostics-marker.test.cjs tests/browser-fingerprint.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-studio.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-original-media.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-reference-upload.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check portable packaging
        run: |
          ./scripts/check-package.ps1
      - name: Rust tests
        run: cargo test --workspace --locked
      - name: Build Windows x64 client
        run: cargo build --release --locked -p muse-desktop
      - name: Check native Windows startup and local browser routing
        run: |
          $data = Join-Path $env:RUNNER_TEMP ('muse-windows-smoke-' + [guid]::NewGuid().ToString('N'))
          $null = New-Item -ItemType Directory -Path $data
          $app = Start-Process -FilePath './target/release/muse-desktop.exe' -ArgumentList @('--smoke-test', '--data-dir', ('"' + $data + '"')) -PassThru
          if (!$app.WaitForExit(90000)) {
            Stop-Process -Id $app.Id -Force
            throw 'Owned native smoke process exceeded its deadline.'
          }
          $result = Get-Content -LiteralPath (Join-Path $data 'smoke-result.json') -Raw | ConvertFrom-Json
          if ($app.ExitCode -ne 0) { throw 'Native Windows process exited unsuccessfully.' }
          if (!$result.passed) { throw 'Native Windows smoke failed.' }
      - name: Package the client
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./scripts/package-windows.ps1 -Tag $env:RELEASE_TAG
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: muse-desktop-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: muse-desktop-windows-x64
          merge-multiple: true
          path: dist
      - name: Publish the versioned download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*-win-x64.zip dist/*-win-x64.zip.sha256 --verify-tag \
            --title "Muse Desktop $RELEASE_TAG" --generate-notes
